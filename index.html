<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 구독 견적 요청 | 클라우드에어</title>
<meta name="description" content="필요한 AI 구독을 담아 요청하시면 담당자가 확인 후 연락드립니다. 클라우드에어 AI 구독 구매대행">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#141414; --ink-2:#5b5b5b; --ink-3:#9a9a9a;
  --line:#e7e7e7; --line-2:#d4d4d4;
  --bg:#f7f7f5; --card:#fff; --soft:#f2f2f0;
  --r:6px; --max:1200px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:#fff;border:1px solid var(--line-2);border-radius:var(--r);padding:9px 14px;font-size:14px}
button:hover{border-color:var(--ink-3)}
button:disabled{opacity:.55;cursor:default}
.btn-dark{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.btn-dark:hover{background:#000;border-color:#000}
input,select{background:#fff;border:1px solid var(--line-2);border-radius:var(--r);padding:9px 11px;width:100%;font-size:14px}
input:focus,select:focus{outline:none;border-color:var(--ink)}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
@media(max-width:640px){.wrap{padding:0 16px}}

/* header */
.top{background:#fff;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:17px;font-weight:800;letter-spacing:.06em}
.brand span{font-size:13px;color:var(--ink-2)}
@media(max-width:640px){.brand span{display:none}}

.head{padding:36px 0 22px}
.head h1{font-size:28px;font-weight:700;letter-spacing:-.03em}
.head p{margin-top:6px;color:var(--ink-2);font-size:15px}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start;padding-bottom:72px}
@media(max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}

/* toolbar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs{display:flex;gap:22px;min-width:0;flex:1;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:none;border-radius:0;padding:12px 0;font-size:14.5px;color:var(--ink-3);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-pressed=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.opts{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.opts input[type=search]{max-width:260px}

/* product cards */
.plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:720px){.plist{grid-template-columns:1fr}}
.pc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.pc.in{border-color:var(--ink)}
.pc-hd{display:flex;align-items:center;gap:12px}
.lg{position:relative;flex:0 0 auto;width:40px;height:40px;border-radius:9px;border:1px solid var(--line);background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center}
.lg b{font-size:16px;font-weight:700;color:var(--ink-2)}
.lg img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:contain;background:#fff}
.lg.sm{width:26px;height:26px;border-radius:6px}
.lg.sm b{font-size:12px}
.lg.sm img{inset:4px;width:calc(100% - 8px);height:calc(100% - 8px)}
.pc-tt h3{font-size:16px;font-weight:700;letter-spacing:-.02em}
.pc-tt p{font-size:12.5px;color:var(--ink-3)}
.pc-use{font-size:13.5px;color:var(--ink-2);line-height:1.5;flex:1}
.pc-ft{display:flex;gap:8px;align-items:flex-end}
.fld span{display:block;font-size:12px;color:var(--ink-3);margin:0 0 4px 2px}
.stp{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.stp button{border:none;border-radius:0;padding:0;width:32px;height:38px;font-size:17px;color:var(--ink-2);background:#fff}
.stp button:hover{background:var(--soft)}
.stp input{border:none;border-radius:0;width:38px;height:38px;padding:0;text-align:center;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.add{flex:1;height:40px}
.pc.in .add{background:var(--soft);border-color:var(--line-2);color:var(--ink);font-weight:600}
.empty-list{grid-column:1/-1;padding:40px 0;text-align:center;color:var(--ink-3)}
.pager{display:flex;justify-content:center;gap:6px;margin-top:20px}
.pager button{min-width:38px;height:38px;padding:0 10px;font-size:14px;color:var(--ink-2)}
.pager button[aria-current=page]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.pager button:disabled{opacity:.35;cursor:default}

/* request list */
.side{position:sticky;top:20px;display:flex;flex-direction:column;gap:12px}
@media(max-width:980px){.side{position:static}}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.box-hd{display:flex;justify-content:space-between;align-items:baseline;padding:16px 18px 12px}
.box-hd h2{font-size:16px;font-weight:700}
.box-hd span{font-size:13px;color:var(--ink-3)}
.ci{display:flex;gap:10px;align-items:center;padding:11px 18px;border-top:1px solid var(--line)}
.ci-tx{flex:1;min-width:0}
.ci-tx b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-tx span{font-size:12.5px;color:var(--ink-2)}
.ci-x{border:none;background:none;padding:2px 0 2px 4px;font-size:17px;line-height:1;color:var(--ink-3)}
.ci-x:hover{color:var(--ink)}
.cart-empty{padding:26px 18px;border-top:1px solid var(--line);text-align:center;font-size:13.5px;color:var(--ink-3)}

.cust{padding:16px 18px 18px}
.cust h2{font-size:15px;font-weight:700;margin-bottom:12px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lb{display:block;font-size:12.5px;color:var(--ink-2);margin:0 0 5px}
.fg{margin-top:10px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.send{width:100%;padding:13px;margin-top:16px}
.ts{margin-top:14px;min-height:65px}
.msg{font-size:13px;line-height:1.6;color:var(--ink);background:var(--soft);border-radius:var(--r);padding:10px 12px;margin-top:12px}

.foot{border-top:1px solid var(--line);background:#fff}
.foot .wrap{padding:22px 24px 30px;font-size:12.5px;color:var(--ink-3);line-height:1.8}
.foot b{color:var(--ink-2);font-weight:600}
.foot a{color:var(--ink-2)}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand"><b>CLOUDAIR</b><span>AI 구독 구매대행</span></div>
  </div>
</header>

<section class="wrap head">
  <h1>AI 구독 견적 요청</h1>
  <p>필요한 서비스를 담고 계정 수와 사용 기간을 정해 보내주세요. 담당자가 확인 후 연락드립니다.</p>
</section>

<div class="wrap grid">
  <main>
    <div class="bar"><nav class="tabs" id="tabs" aria-label="분류"></nav></div>
    <div class="opts">
      <input type="search" id="q" placeholder="서비스 이름 검색" aria-label="서비스 검색">
    </div>
    <div class="plist" id="plist"></div>
    <nav class="pager" id="pager" aria-label="페이지"></nav>
  </main>

  <aside class="side">
    <div class="box">
      <div class="box-hd"><h2>요청 목록</h2><span id="cnt"></span></div>
      <div id="cartList"></div>
    </div>

    <form class="box cust" id="reqForm" novalidate>
      <h2>요청하시는 분</h2>
      <div class="f2">
        <div><label class="lb" for="cName">성명</label><input id="cName" placeholder="홍길동" autocomplete="name"></div>
        <div><label class="lb" for="cOrg">소속</label><input id="cOrg" placeholder="OO대학교" autocomplete="organization"></div>
      </div>
      <div class="fg"><label class="lb" for="cMail">이메일</label><input id="cMail" type="email" placeholder="name@example.ac.kr" autocomplete="email"></div>
      <div class="fg"><label class="lb" for="cTel">연락처 (선택)</label><input id="cTel" placeholder="010-0000-0000" autocomplete="tel"></div>
      <div class="hp" aria-hidden="true"><input id="cWeb" tabindex="-1" autocomplete="off"></div>
      <div id="tsBox" class="ts" hidden></div>
      <button type="submit" class="btn-dark send" id="btnSend">구매 요청 보내기</button>
      <div id="msg" class="msg" hidden></div>
    </form>
  </aside>
</div>

<footer class="foot">
  <div class="wrap">
    <b>클라우드에어</b> · AI 구독 구매대행<br>
    요청을 보내주시면 담당자가 가격과 진행 방법을 안내해 드립니다.
    문의 <a id="footMail" href="mailto:cloudairac01@gmail.com">cloudairac01@gmail.com</a>
  </div>
</footer>

<script src="products.js"></script>
<script>
(function(){
  var D = window.CA_DATA;
  var $ = function(id){ return document.getElementById(id); };
  if(!D){ $('plist').innerHTML = '<p class="empty-list">상품 데이터를 불러오지 못했습니다. products.js 가 index.html 과 같은 폴더에 있는지 확인해 주세요.</p>'; return; }

  var M = D.meta, MAIL = (M.company && M.company.email) || '';
  var LIM = { qty: [1, 99], mo: [1, 36] }, DEF_MO = 1, PER = 6;
  var cart = {}, cat = '전체', kw = '', page = 1;
  var BUY = { sale: true, prereq: true };

  (function(a){ if(a && MAIL){ a.href = 'mailto:' + MAIL; a.textContent = MAIL; } })($('footMail'));

  function byId(id){ for(var i = 0; i < D.products.length; i++) if(D.products[i].id === id) return D.products[i]; return null; }
  function canBuy(p){ return BUY[p.status] && p.plans && p.plans.length; }
  function planName(pl){ return typeof pl === 'string' ? pl : pl.n; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function clamp(f, v){ v = parseInt(v, 10); return isNaN(v) ? LIM[f][0] : Math.max(LIM[f][0], Math.min(LIM[f][1], v)); }
  function logo(p, sm){
    var img = p.logo ? '<img src="' + esc(p.logo) + '" alt="" loading="lazy" onerror="this.remove()">' : '';
    return '<span class="lg' + (sm ? ' sm' : '') + '" aria-hidden="true"><b>' + esc(p.name.charAt(0)) + '</b>' + img + '</span>';
  }
  function stepper(f, id, v, label){
    return '<div class="fld"><span>' + label + '</span><div class="stp">'
      + '<button type="button" data-step="-1" data-f="' + f + '" data-id="' + id + '" aria-label="' + label + ' 줄이기">−</button>'
      + '<input type="number" min="' + LIM[f][0] + '" max="' + LIM[f][1] + '" value="' + v + '" data-f="' + f + '" data-id="' + id + '" aria-label="' + label + '">'
      + '<button type="button" data-step="1" data-f="' + f + '" data-id="' + id + '" aria-label="' + label + ' 늘리기">+</button></div></div>';
  }

  /* 분류 탭 */
  function tabs(){
    $('tabs').innerHTML = ['전체'].concat(D.categories).map(function(c){
      return '<button class="tab" data-cat="' + c + '" aria-pressed="' + (c === cat) + '">' + c + '</button>';
    }).join('');
  }
  $('tabs').addEventListener('click', function(e){
    var b = e.target.closest('[data-cat]'); if(!b) return;
    cat = b.dataset.cat; page = 1; tabs(); list();
  });

  /* 상품 목록 */
  function list(){
    var items = D.products.filter(function(p){
      if(!canBuy(p)) return false;
      if(cat !== '전체' && p.category !== cat) return false;
      if(kw && (p.name + ' ' + p.vendor + ' ' + p.use).toLowerCase().indexOf(kw) < 0) return false;
      return true;
    });
    if(!items.length){ $('plist').innerHTML = '<p class="empty-list">찾는 서비스가 없습니다.</p>'; $('pager').innerHTML = ''; return; }

    var pages = Math.ceil(items.length / PER);
    page = Math.max(1, Math.min(page, pages));
    pager(pages);
    items = items.slice((page - 1) * PER, page * PER);

    $('plist').innerHTML = items.map(function(p){
      var c = cart[p.id], pi = c ? c.planIdx : 0;
      return '<article class="pc' + (c ? ' in' : '') + '">'
        + '<div class="pc-hd">' + logo(p) + '<div class="pc-tt"><h3>' + esc(p.name) + '</h3><p>' + esc(p.vendor) + '</p></div></div>'
        + '<p class="pc-use">' + esc(p.use) + '</p>'
        + '<select data-plan="' + p.id + '" aria-label="' + esc(p.name) + ' 플랜">'
        + p.plans.map(function(pl, i){ return '<option value="' + i + '"' + (i === pi ? ' selected' : '') + '>' + esc(planName(pl)) + '</option>'; }).join('')
        + '</select>'
        + '<div class="pc-ft">' + stepper('qty', p.id, c ? c.qty : 1, '계정') + stepper('mo', p.id, c ? c.mo : DEF_MO, '개월')
        + '<button type="button" class="add" data-add="' + p.id + '">' + (c ? '담김' : '담기') + '</button></div></article>';
    }).join('');
  }

  function pager(pages){
    if(pages < 2){ $('pager').innerHTML = ''; return; }
    var h = '<button type="button" data-pg="' + (page - 1) + '"' + (page === 1 ? ' disabled' : '') + ' aria-label="이전 페이지">‹</button>';
    for(var i = 1; i <= pages; i++) h += '<button type="button" data-pg="' + i + '"' + (i === page ? ' aria-current="page"' : '') + '>' + i + '</button>';
    h += '<button type="button" data-pg="' + (page + 1) + '"' + (page === pages ? ' disabled' : '') + ' aria-label="다음 페이지">›</button>';
    $('pager').innerHTML = h;
  }
  $('pager').addEventListener('click', function(e){
    var b = e.target.closest('[data-pg]'); if(!b || b.disabled) return;
    page = +b.dataset.pg; list();
    var top = document.querySelector('.bar').getBoundingClientRect().top;
    if(top < 0) window.scrollBy({ top: top - 12, behavior: 'smooth' });
  });

  function field(f, id){ return $('plist').querySelector('input[data-f="' + f + '"][data-id="' + id + '"]'); }
  function setField(f, id, v){
    var i = field(f, id); if(!i) return;
    i.value = clamp(f, v);
    if(cart[id]){ cart[id][f] = +i.value; render(); }
  }
  $('plist').addEventListener('click', function(e){
    var t = e.target.closest('button'); if(!t) return;
    if(t.dataset.step){ var i = field(t.dataset.f, t.dataset.id); setField(t.dataset.f, t.dataset.id, +i.value + (+t.dataset.step)); }
    else if(t.dataset.add){
      var id = t.dataset.add, sel = $('plist').querySelector('[data-plan="' + id + '"]');
      cart[id] = { planIdx: +sel.value || 0, qty: clamp('qty', field('qty', id).value), mo: clamp('mo', field('mo', id).value) };
      hideMsg(); list(); render();
    }
  });
  $('plist').addEventListener('change', function(e){
    var t = e.target;
    if(t.dataset.plan && cart[t.dataset.plan]){ cart[t.dataset.plan].planIdx = +t.value || 0; render(); }
    if(t.dataset.f) setField(t.dataset.f, t.dataset.id, t.value);
  });

  /* 요청 목록 */
  function lines(){
    return Object.keys(cart).map(function(id){
      var p = byId(id), c = cart[id], pl = p && p.plans[c.planIdx];
      return pl == null ? null : { id: id, p: p, plan: planName(pl), qty: c.qty, mo: c.mo };
    }).filter(Boolean);
  }
  function render(){
    var L = lines();
    $('cnt').textContent = L.length ? L.length + '개 서비스' : '';
    $('cartList').innerHTML = !L.length ? '<p class="cart-empty">담은 서비스가 없습니다</p>' : L.map(function(l){
      return '<div class="ci">' + logo(l.p, true) + '<div class="ci-tx"><b>' + esc(l.p.name) + '</b><span>' + esc(l.plan) + ' · ' + l.qty + '계정 · ' + l.mo + '개월</span></div>'
        + '<button type="button" class="ci-x" data-del="' + l.id + '" aria-label="' + esc(l.p.name) + ' 빼기">×</button></div>';
    }).join('');
  }
  $('cartList').addEventListener('click', function(e){
    var b = e.target.closest('[data-del]'); if(!b) return;
    delete cart[b.dataset.del]; list(); render();
  });

  /* 사람 확인 (Cloudflare Turnstile) — products.js 에 사이트 키가 있을 때만 */
  var TS_KEY = M.turnstileSiteKey || '', tsId = null;
  if(TS_KEY){
    $('tsBox').hidden = false;
    window.__caTsReady = function(){
      tsId = window.turnstile.render('#tsBox', { sitekey: TS_KEY, language: 'ko', size: 'flexible', theme: 'light' });
    };
    var sc = document.createElement('script');
    sc.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=__caTsReady';
    sc.async = true; sc.defer = true;
    document.head.appendChild(sc);
  }
  function tsToken(){ return (TS_KEY && window.turnstile && tsId != null) ? window.turnstile.getResponse(tsId) || '' : ''; }
  function tsReset(){ if(TS_KEY && window.turnstile && tsId != null) window.turnstile.reset(tsId); }

  /* 요청 보내기 → 텔레그램 */
  function showMsg(t){ $('msg').hidden = false; $('msg').textContent = t; }
  function hideMsg(){ $('msg').hidden = true; }
  ['cName', 'cOrg', 'cMail'].forEach(function(id){ $(id).addEventListener('input', hideMsg); });

  $('reqForm').addEventListener('submit', function(e){
    e.preventDefault();
    var L = lines(), c = { name: $('cName').value.trim(), org: $('cOrg').value.trim(), email: $('cMail').value.trim(), tel: $('cTel').value.trim() };
    var m = '';
    if(!L.length) m = '요청할 서비스를 먼저 담아 주세요.';
    else if(!c.name) m = '성명을 입력해 주세요.';
    else if(!c.org) m = '소속을 입력해 주세요.';
    else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c.email)) m = '이메일 주소를 확인해 주세요.';
    else if(/(https?:\/\/|www\.)/i.test(c.name + ' ' + c.org)) m = '성명·소속에는 링크를 넣을 수 없습니다.';
    else if(c.tel && !/^[0-9+\-() ]{1,20}$/.test(c.tel)) m = '연락처는 숫자와 - 만 입력해 주세요.';
    if(m){ showMsg(m); return; }
    var ts = tsToken();
    if(TS_KEY && !ts){ showMsg('보내기 전에 위의 사람 확인을 완료해 주세요.'); return; }
    if(!M.telegramRelayUrl){ showMsg('지금은 온라인 요청을 받을 수 없습니다. ' + MAIL + ' 로 연락 주세요.'); return; }

    var btn = $('btnSend'), ctrl = window.AbortController ? new AbortController() : null;
    btn.disabled = true; btn.textContent = '보내는 중…'; hideMsg();
    var timer = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 15000);
    fetch(M.telegramRelayUrl, {
      method: 'POST',
      body: JSON.stringify({
        hp: $('cWeb').value, ts: ts, name: c.name, org: c.org, email: c.email, tel: c.tel,
        items: L.map(function(l){ return { name: l.p.name, plan: l.plan, qty: l.qty, months: l.mo }; })
      }),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function(r){ return r.json(); }).then(function(j){
      if(!j || !j.ok) throw new Error((j && j.error) || 'fail');
      cart = {}; list(); render();
      showMsg('요청이 접수되었습니다. 담당자가 확인 후 ' + c.email + ' 로 연락드리겠습니다.');
    }).catch(function(err){
      var code = err && err.message;
      showMsg(
        code === 'captcha' ? '사람 확인이 만료되었습니다. 다시 확인한 뒤 보내주세요.' :
        code === 'invalid' ? '입력 내용을 다시 확인해 주세요. 링크나 목록에 없는 상품은 보낼 수 없습니다.' :
        code === 'busy'    ? '지금 요청이 많아 잠시 받을 수 없습니다. 몇 분 뒤 다시 보내주세요.' :
        '요청을 보내지 못했습니다. 잠시 후 다시 시도하시거나 ' + MAIL + ' 로 연락 주세요.');
    }).then(function(){
      clearTimeout(timer); tsReset(); btn.disabled = false; btn.textContent = '구매 요청 보내기';
    });
  });

  $('q').addEventListener('input', function(){ kw = this.value.trim().toLowerCase(); page = 1; list(); });

  tabs(); list(); render();
})();
</script>
</body>
</html>
