<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 구독 견적 | 클라우드에어</title>
<meta name="description" content="필요한 AI 구독과 계정 수를 고르면 금액이 바로 계산됩니다. 클라우드에어 AI 구독 구매대행">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#141414; --ink-2:#5b5b5b; --ink-3:#9a9a9a;
  --line:#e7e7e7; --line-2:#d4d4d4;
  --bg:#f7f7f5; --card:#fff; --soft:#f2f2f0;
  --r:6px; --max:1200px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:#fff;border:1px solid var(--line-2);border-radius:var(--r);padding:9px 14px;font-size:14px}
button:hover{border-color:var(--ink-3)}
.btn-dark{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.btn-dark:hover{background:#000;border-color:#000}
input,select{background:#fff;border:1px solid var(--line-2);border-radius:var(--r);padding:9px 11px;width:100%;font-size:14px}
input:focus,select:focus{outline:none;border-color:var(--ink)}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
@media(max-width:640px){.wrap{padding:0 16px}}

/* header */
.top{background:#fff;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:17px;font-weight:800;letter-spacing:.06em}
.brand span{font-size:13px;color:var(--ink-2)}
.fx{font-size:12.5px;color:var(--ink-2);text-align:right;white-space:nowrap}
.fx em{font-style:normal;color:var(--ink);font-weight:600}
@media(max-width:640px){.brand span{display:none}}

.head{padding:36px 0 22px}
.head h1{font-size:28px;font-weight:700;letter-spacing:-.03em}
.head p{margin-top:6px;color:var(--ink-2);font-size:15px}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start;padding-bottom:72px}
@media(max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}

/* toolbar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs{display:flex;gap:22px;min-width:0;flex:1;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:none;border-radius:0;padding:12px 0;font-size:14.5px;color:var(--ink-3);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-pressed=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.opts{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.opts input[type=search]{max-width:260px}
.opts label{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.opts label input{width:auto;margin:0;accent-color:var(--ink)}

/* product cards */
.plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:720px){.plist{grid-template-columns:1fr}}
.pc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.pc.in{border-color:var(--ink)}
.pc-hd{display:flex;align-items:center;gap:12px}
.lg{position:relative;flex:0 0 auto;width:40px;height:40px;border-radius:9px;border:1px solid var(--line);background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center}
.lg b{font-size:16px;font-weight:700;color:var(--ink-2)}
.lg img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:contain;background:#fff}
.lg.sm{width:26px;height:26px;border-radius:6px}
.lg.sm b{font-size:12px}
.lg.sm img{inset:4px;width:calc(100% - 8px);height:calc(100% - 8px)}
.pc-tt h3{font-size:16px;font-weight:700;letter-spacing:-.02em}
.pc-tt p{font-size:12.5px;color:var(--ink-3)}
.pc-use{font-size:13.5px;color:var(--ink-2);line-height:1.5;flex:1}
.pc-ft{display:flex;gap:8px}
.stp{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.stp button{border:none;border-radius:0;padding:0;width:34px;height:38px;font-size:17px;color:var(--ink-2);background:#fff}
.stp button:hover{background:var(--soft)}
.stp input{border:none;border-radius:0;width:38px;height:38px;padding:0;text-align:center;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.add{flex:1}
.pc.in .add{background:var(--soft);border-color:var(--line-2);color:var(--ink);font-weight:600}
.pc.off{background:#fbfbfa}
.pc.off .pc-tt h3{color:var(--ink-2)}
.na{font-size:13px;color:var(--ink-3);display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:2px}
.na button{background:none;border:none;padding:0;font-size:13px;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.empty-list{grid-column:1/-1;padding:40px 0;text-align:center;color:var(--ink-3)}

/* cart */
.side{position:sticky;top:20px;display:flex;flex-direction:column;gap:12px}
@media(max-width:980px){.side{position:static}}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.box-hd{display:flex;justify-content:space-between;align-items:baseline;padding:16px 18px 12px}
.box-hd h2{font-size:16px;font-weight:700}
.box-hd span{font-size:13px;color:var(--ink-3)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);margin:0 18px 14px;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.seg button{border:none;border-radius:0;padding:8px 0;font-size:13px;color:var(--ink-2);background:#fff}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff;font-weight:600}
.ci{display:flex;gap:10px;align-items:center;padding:11px 18px;border-top:1px solid var(--line)}
.ci-tx{flex:1;min-width:0}
.ci-tx b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-tx span{font-size:12px;color:var(--ink-3)}
.ci-am{font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ci-x{border:none;background:none;padding:2px 0 2px 4px;font-size:17px;line-height:1;color:var(--ink-3)}
.ci-x:hover{color:var(--ink)}
.cart-empty{padding:26px 18px;border-top:1px solid var(--line);text-align:center;font-size:13.5px;color:var(--ink-3)}
.sums{border-top:1px solid var(--line);padding:12px 18px 4px}
.sums div{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-2);padding:3px 0}
.sums b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 18px 16px}
.total span{font-size:14px;font-weight:600}
.total b{font-size:24px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.acts{display:grid;gap:8px;padding:0 18px 16px}
.acts button{padding:12px}
.fine{font-size:12px;color:var(--ink-3);padding:0 18px 16px;line-height:1.6}

.cust{padding:16px 18px 18px}
.cust h2{font-size:15px;font-weight:700;margin-bottom:12px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lb{display:block;font-size:12.5px;color:var(--ink-2);margin:0 0 5px}
.fg{margin-top:10px}
.err{font-size:13px;color:var(--ink);background:var(--soft);border-radius:var(--r);padding:9px 11px;margin-top:12px}

/* quote sheet */
#sheetWrap{display:none;position:fixed;inset:0;background:rgba(20,20,20,.5);z-index:50;overflow:auto;padding:28px 14px}
#sheetWrap.on{display:block}
.sheet{background:#fff;max-width:760px;margin:0 auto;padding:44px 48px;border-radius:var(--r)}
@media(max-width:640px){.sheet{padding:28px 20px}}
.sh-top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:22px}
.sh-top h2{font-size:26px;font-weight:800;letter-spacing:.3em}
.sh-top span{font-size:13px;font-weight:700;letter-spacing:.06em}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:24px;font-size:13.5px;margin-bottom:22px}
.meta p{padding:3px 0}
.meta p i{font-style:normal;display:inline-block;width:64px;color:var(--ink-3)}
.sheet table{width:100%;border-collapse:collapse;font-size:13.5px}
.sheet th{text-align:left;font-weight:600;font-size:12.5px;color:var(--ink-2);border-bottom:1px solid var(--ink);padding:9px 8px}
.sheet td{padding:10px 8px;border-bottom:1px solid var(--line)}
.sheet .n{text-align:right;font-variant-numeric:tabular-nums}
.sheet tfoot td{border-bottom:none;border-top:2px solid var(--ink);font-weight:700;font-size:15px;padding-top:14px}
.sh-note{font-size:12px;color:var(--ink-2);margin-top:22px;line-height:1.75}
.sh-act{max-width:760px;margin:12px auto 0;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media print{
  body{background:#fff}
  .top,.head,.grid,.foot,.sh-act{display:none!important}
  #sheetWrap{display:block!important;position:static;background:#fff;padding:0;overflow:visible}
  .sheet{max-width:none;padding:0}
}

.foot{border-top:1px solid var(--line);background:#fff}
.foot .wrap{padding:22px 24px 30px;font-size:12.5px;color:var(--ink-3);line-height:1.8}
.foot b{color:var(--ink-2);font-weight:600}
.foot a{color:var(--ink-2)}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand"><b>CLOUDAIR</b><span>AI 구독 구매대행</span></div>
    <div class="fx" id="fx">환율 확인 중</div>
  </div>
</header>

<section class="wrap head">
  <h1>AI 구독 견적</h1>
  <p>사용할 서비스와 계정 수를 고르면 금액이 바로 계산됩니다.</p>
</section>

<div class="wrap grid">
  <main>
    <div class="bar"><nav class="tabs" id="tabs" aria-label="분류"></nav></div>
    <div class="opts">
      <input type="search" id="q" placeholder="서비스 이름 검색" aria-label="서비스 검색">
      <label><input type="checkbox" id="onlySale">구매 가능한 것만</label>
    </div>
    <div class="plist" id="plist"></div>
  </main>

  <aside class="side">
    <div class="box">
      <div class="box-hd"><h2>견적 요약</h2><span id="cnt"></span></div>
      <div class="seg" role="group" aria-label="구독 기간">
        <button data-mo="1" aria-pressed="false">1개월</button>
        <button data-mo="3" aria-pressed="false">3개월</button>
        <button data-mo="6" aria-pressed="false">6개월</button>
        <button data-mo="12" aria-pressed="true">12개월</button>
      </div>
      <div id="cartList"></div>
      <div id="sums"></div>
      <div class="total"><span>총 견적 금액</span><b id="tot">0원</b></div>
      <div class="acts">
        <button class="btn-dark" id="btnSheet">견적서 보기</button>
        <button id="btnCopy">견적 내용 복사</button>
      </div>
      <p class="fine" id="fine"></p>
    </div>

    <div class="box cust">
      <h2>견적 받으실 분</h2>
      <div class="f2">
        <div><label class="lb" for="cName">성명</label><input id="cName" placeholder="홍길동"></div>
        <div><label class="lb" for="cOrg">소속</label><input id="cOrg" placeholder="OO대학교"></div>
      </div>
      <div class="fg"><label class="lb" for="cMail">이메일</label><input id="cMail" type="email" placeholder="name@example.ac.kr"></div>
      <div class="fg"><label class="lb" for="cTel">연락처 (선택)</label><input id="cTel" placeholder="010-0000-0000"></div>
      <div id="formErr" class="err" hidden></div>
    </div>
  </aside>
</div>

<footer class="foot">
  <div class="wrap">
    <b>클라우드에어</b> · AI 구독 구매대행<br>
    본 견적은 참고용 자동 산출 금액이며, 최종 금액은 담당자 확인 후 확정됩니다.
    문의 <a id="footMail" href="mailto:swca06@go.makers-ai.kr">swca06@go.makers-ai.kr</a>
  </div>
</footer>

<div id="sheetWrap" role="dialog" aria-modal="true" aria-label="견적서">
  <div class="sheet" id="sheet"></div>
  <div class="sh-act">
    <button id="btnPrint">인쇄 / PDF 저장</button>
    <button id="btnMail">이메일로 견적 요청</button>
    <button class="btn-dark" id="btnClose">닫기</button>
  </div>
</div>

<script src="products.js"></script>
<script>
(function(){
  var D = window.CA_DATA;
  var $ = function(id){ return document.getElementById(id); };
  if(!D){ $('plist').innerHTML = '<p class="empty-list">상품 데이터를 불러오지 못했습니다. products.js 가 index.html 과 같은 폴더에 있는지 확인해 주세요.</p>'; return; }

  var M = D.meta, FEE = M.feeRate || 0;
  var fx = { USD: M.fxFallback.USD, EUR: M.fxFallback.EUR, KRW: 1 };
  var fxLive = false, fxDate = M.updatedAt;
  var cart = {}, months = 12, cat = '전체', kw = '', onlySale = false;

  var BUY = { sale: true, prereq: true };
  var NA  = { bundle_only: '단독 구매 불가', blocked: '현재 구매 불가', review: '가격 확인 중' };

  (function(a){ if(a && M.company && M.company.email){ a.href = 'mailto:' + M.company.email; a.textContent = M.company.email; } })($('footMail'));

  function won(n){ return Math.round(n).toLocaleString('ko-KR') + '원'; }
  function unit(p, pl){ return Math.round(pl.p * fx[p.cur] * (1 + FEE) / 10) * 10; }
  function byId(id){ for(var i = 0; i < D.products.length; i++) if(D.products[i].id === id) return D.products[i]; return null; }
  function canBuy(p){ return BUY[p.status] && p.plans && p.plans.length; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function logo(p, sm){
    var img = p.domain ? '<img src="https://www.google.com/s2/favicons?domain=' + p.domain + '&sz=128" alt="" loading="lazy" onerror="this.remove()">' : '';
    return '<span class="lg' + (sm ? ' sm' : '') + '" aria-hidden="true"><b>' + esc(p.name.charAt(0)) + '</b>' + img + '</span>';
  }

  /* 환율 */
  function paintFx(){
    $('fx').innerHTML = '1 USD <em>' + Math.round(fx.USD).toLocaleString('ko-KR') + '원</em>'
      + (fxLive ? ' · ' + fxDate + ' 기준' : '');
    $('fine').textContent = '대행 수수료가 포함된 금액입니다. 해외 결제 서비스는 결제일 환율에 따라 금액이 조금 달라질 수 있습니다.';
  }
  function loadFx(){
    paintFx();
    fetch('https://open.er-api.com/v6/latest/USD').then(function(r){ return r.json(); }).then(function(j){
      if(!j || !j.rates || !j.rates.KRW) return;
      fx.USD = j.rates.KRW;
      if(j.rates.EUR) fx.EUR = j.rates.KRW / j.rates.EUR;
      fxLive = true;
      if(j.time_last_update_utc) fxDate = new Date(j.time_last_update_utc).toISOString().slice(0, 10);
      paintFx(); list(); render();
    }).catch(function(){});
  }

  /* 분류 탭 */
  function tabs(){
    $('tabs').innerHTML = ['전체'].concat(D.categories).map(function(c){
      return '<button class="tab" data-cat="' + c + '" aria-pressed="' + (c === cat) + '">' + c + '</button>';
    }).join('');
  }
  $('tabs').addEventListener('click', function(e){
    var b = e.target.closest('[data-cat]'); if(!b) return;
    cat = b.dataset.cat; tabs(); list();
  });

  /* 상품 목록 */
  function list(){
    var items = D.products.filter(function(p){
      if(cat !== '전체' && p.category !== cat) return false;
      if(kw && (p.name + ' ' + p.vendor + ' ' + p.use).toLowerCase().indexOf(kw) < 0) return false;
      if(onlySale && !canBuy(p)) return false;
      return true;
    });
    if(!items.length){ $('plist').innerHTML = '<p class="empty-list">찾는 서비스가 없습니다.</p>'; return; }

    $('plist').innerHTML = items.map(function(p){
      var c = cart[p.id], head =
        '<div class="pc-hd">' + logo(p) + '<div class="pc-tt"><h3>' + esc(p.name) + '</h3><p>' + esc(p.vendor) + '</p></div></div>'
        + '<p class="pc-use">' + esc(p.use) + '</p>';

      if(!canBuy(p)){
        var alt = p.altId ? byId(p.altId) : null;
        return '<article class="pc off">' + head + '<div class="na">' + (NA[p.status] || '현재 구매 불가')
          + (alt ? '<button data-goto="' + alt.id + '">' + esc(alt.name) + ' 구독에 포함</button>' : '') + '</div></article>';
      }
      var pi = c ? c.planIdx : 0, q = c ? c.qty : 1;
      return '<article class="pc' + (c ? ' in' : '') + '">' + head
        + '<select data-plan="' + p.id + '" aria-label="' + esc(p.name) + ' 플랜">'
        + p.plans.map(function(pl, i){ return '<option value="' + i + '"' + (i === pi ? ' selected' : '') + '>' + esc(pl.n) + ' · 월 ' + won(unit(p, pl)) + '</option>'; }).join('')
        + '</select>'
        + '<div class="pc-ft"><div class="stp"><button data-dec="' + p.id + '" aria-label="수량 줄이기">−</button>'
        + '<input type="number" min="1" max="99" value="' + q + '" data-qty="' + p.id + '" aria-label="' + esc(p.name) + ' 계정 수">'
        + '<button data-inc="' + p.id + '" aria-label="수량 늘리기">+</button></div>'
        + '<button class="add" data-add="' + p.id + '">' + (c ? '담김' : '담기') + '</button></div></article>';
    }).join('');
  }

  function clampQty(v){ v = parseInt(v, 10); return isNaN(v) ? 1 : Math.max(1, Math.min(99, v)); }
  function qtyInput(id){ return $('plist').querySelector('[data-qty="' + id + '"]'); }
  function setQty(id, v){
    var i = qtyInput(id); if(!i) return;
    i.value = clampQty(v);
    if(cart[id]){ cart[id].qty = +i.value; render(); }
  }
  $('plist').addEventListener('click', function(e){
    var t = e.target.closest('button'); if(!t) return;
    if(t.dataset.dec) setQty(t.dataset.dec, +qtyInput(t.dataset.dec).value - 1);
    else if(t.dataset.inc) setQty(t.dataset.inc, +qtyInput(t.dataset.inc).value + 1);
    else if(t.dataset.add){
      var id = t.dataset.add, sel = $('plist').querySelector('[data-plan="' + id + '"]');
      cart[id] = { planIdx: +sel.value || 0, qty: clampQty(qtyInput(id).value) };
      list(); render();
    } else if(t.dataset.goto){
      var a = byId(t.dataset.goto); cat = '전체'; kw = a.name.toLowerCase(); $('q').value = a.name;
      tabs(); list(); window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });
  $('plist').addEventListener('change', function(e){
    var t = e.target;
    if(t.dataset.plan && cart[t.dataset.plan]){ cart[t.dataset.plan].planIdx = +t.value || 0; render(); }
    if(t.dataset.qty) setQty(t.dataset.qty, t.value);
  });

  /* 견적 계산 */
  function lines(){
    return Object.keys(cart).map(function(id){
      var p = byId(id), c = cart[id], pl = p && p.plans[c.planIdx];
      if(!pl) return null;
      var u = unit(p, pl);
      return { p: p, plan: pl.n, qty: c.qty, unit: u, monthly: u * c.qty, sub: u * c.qty * months };
    }).filter(Boolean);
  }
  function sum(L, k){ return L.reduce(function(a, l){ return a + l[k]; }, 0); }

  function render(){
    var L = lines();
    $('cnt').textContent = L.length ? L.length + '개 서비스' : '';
    if(!L.length){
      $('cartList').innerHTML = '<p class="cart-empty">담은 서비스가 없습니다</p>';
      $('sums').innerHTML = ''; $('tot').textContent = '0원'; return;
    }
    $('cartList').innerHTML = L.map(function(l){
      return '<div class="ci">' + logo(l.p, true) + '<div class="ci-tx"><b>' + esc(l.p.name) + '</b><span>' + esc(l.plan) + ' · ' + l.qty + '계정</span></div>'
        + '<div class="ci-am">' + won(l.monthly) + '</div><button class="ci-x" data-del="' + l.p.id + '" aria-label="' + esc(l.p.name) + ' 빼기">×</button></div>';
    }).join('');
    $('sums').innerHTML = '<div class="sums"><div><span>월 합계</span><b>' + won(sum(L, 'monthly')) + '</b></div>'
      + '<div><span>구독 기간</span><b>' + months + '개월</b></div></div>';
    $('tot').textContent = won(sum(L, 'sub'));
  }
  $('cartList').addEventListener('click', function(e){
    var b = e.target.closest('[data-del]'); if(!b) return;
    delete cart[b.dataset.del]; list(); render();
  });
  document.querySelectorAll('[data-mo]').forEach(function(b){
    b.addEventListener('click', function(){
      months = +b.dataset.mo;
      document.querySelectorAll('[data-mo]').forEach(function(x){ x.setAttribute('aria-pressed', x === b); });
      render();
    });
  });

  /* 견적서 */
  var QNO = (function(){
    var d = new Date(), z = function(n){ return ('0' + n).slice(-2); };
    return 'CA-' + d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + '-' + (Math.floor(Math.random() * 900) + 100);
  })();
  function cust(){ return { name: $('cName').value.trim(), org: $('cOrg').value.trim(), mail: $('cMail').value.trim(), tel: $('cTel').value.trim() }; }
  function validate(){
    var c = cust(), m = '';
    if(!lines().length) m = '견적에 담은 서비스가 없습니다.';
    else if(!c.name) m = '성명을 입력해 주세요.';
    else if(!c.org) m = '소속을 입력해 주세요.';
    else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c.mail)) m = '이메일 주소를 확인해 주세요.';
    $('formErr').hidden = !m; $('formErr').textContent = m;
    if(m) $('formErr').scrollIntoView({ block: 'center', behavior: 'smooth' });
    return !m;
  }
  ['cName', 'cOrg', 'cMail'].forEach(function(id){ $(id).addEventListener('input', function(){ $('formErr').hidden = true; }); });

  function buildSheet(){
    var L = lines(), c = cust(), today = new Date().toISOString().slice(0, 10);
    $('sheet').innerHTML =
      '<div class="sh-top"><h2>견적서</h2><span>CLOUDAIR</span></div>'
      + '<div class="meta"><div>'
      + '<p><i>수신</i>' + esc(c.org) + ' ' + esc(c.name) + '</p><p><i>이메일</i>' + esc(c.mail) + '</p>'
      + (c.tel ? '<p><i>연락처</i>' + esc(c.tel) + '</p>' : '')
      + '</div><div>'
      + '<p><i>공급자</i>' + esc(M.company.name) + '</p><p><i>견적번호</i>' + QNO + '</p>'
      + '<p><i>견적일</i>' + today + '</p><p><i>유효기간</i>견적일로부터 14일</p>'
      + '</div></div>'
      + '<table><thead><tr><th>서비스</th><th>플랜</th><th class="n">계정</th><th class="n">월 단가</th><th class="n">금액 (' + months + '개월)</th></tr></thead><tbody>'
      + L.map(function(l){ return '<tr><td>' + esc(l.p.name) + '</td><td>' + esc(l.plan) + '</td><td class="n">' + l.qty + '</td><td class="n">' + won(l.unit) + '</td><td class="n">' + won(l.sub) + '</td></tr>'; }).join('')
      + '</tbody><tfoot><tr><td colspan="4">합계</td><td class="n">' + won(sum(L, 'sub')) + '</td></tr></tfoot></table>'
      + '<p class="sh-note">적용 환율 1 USD = ' + Math.round(fx.USD).toLocaleString('ko-KR') + '원 (' + fxDate + ' 기준). 해외 결제 서비스는 결제일 환율에 따라 최종 금액이 조정될 수 있습니다.<br>'
      + '금액에는 계정 개설·결제·갱신 관리 대행이 포함되어 있습니다.<br>'
      + '공급사의 정책 변경으로 인한 기능·가격·서비스 구조 변경에 대해 판매사는 책임지지 않습니다.</p>';
  }
  function textQuote(){
    var L = lines(), c = cust(), s = '[AI 구독 견적 요청] ' + QNO + '\n';
    s += c.org + ' ' + c.name + ' (' + c.mail + (c.tel ? ' / ' + c.tel : '') + ')\n구독 기간 ' + months + '개월\n\n';
    L.forEach(function(l){ s += '- ' + l.p.name + ' ' + l.plan + ' / ' + l.qty + '계정 / 월 ' + won(l.unit) + ' / ' + won(l.sub) + '\n'; });
    s += '\n합계 ' + won(sum(L, 'sub')) + '\n적용 환율 1 USD = ' + Math.round(fx.USD).toLocaleString('ko-KR') + '원 (' + fxDate + ')\n';
    return s;
  }

  $('btnSheet').addEventListener('click', function(){ if(validate()){ buildSheet(); $('sheetWrap').classList.add('on'); } });
  $('btnClose').addEventListener('click', function(){ $('sheetWrap').classList.remove('on'); });
  $('sheetWrap').addEventListener('click', function(e){ if(e.target === this) this.classList.remove('on'); });
  $('btnPrint').addEventListener('click', function(){ window.print(); });
  $('btnMail').addEventListener('click', function(){
    var c = cust();
    location.href = 'mailto:' + M.company.email + '?subject=' + encodeURIComponent('[견적요청] ' + c.org + ' ' + c.name + ' ' + QNO) + '&body=' + encodeURIComponent(textQuote());
  });
  $('btnCopy').addEventListener('click', function(){
    if(!validate()) return;
    var b = this, t = textQuote();
    function ok(){ b.textContent = '복사했습니다'; setTimeout(function(){ b.textContent = '견적 내용 복사'; }, 1500); }
    function fb(){
      var ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); ok(); }catch(e){ window.prompt('아래 내용을 복사해 주세요', t); }
      document.body.removeChild(ta);
    }
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, fb); else fb();
  });

  $('q').addEventListener('input', function(){ kw = this.value.trim().toLowerCase(); list(); });
  $('onlySale').addEventListener('change', function(){ onlySale = this.checked; list(); });

  tabs(); list(); render(); loadFx();
})();
</script>
</body>
</html>
